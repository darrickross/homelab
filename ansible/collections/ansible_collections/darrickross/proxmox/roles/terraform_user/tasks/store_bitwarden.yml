---
# ==============================================================================
# store_bitwarden.yml — Store Proxmox API token in Bitwarden
#
# All tasks run on the Ansible controller (delegate_to: localhost, run_once: true).
# BW_SESSION must be set in the environment before the playbook runs.
# The token secret is never logged (no_log: true on all sensitive tasks).
#
# Bitwarden item structure:
#   login.username = full token ID (terraform@pve!terraform-ansible)
#   login.password = UUID secret
#   login.uris     = https://<proxmox-host>:8006
#   custom fields  = PVE User, Token ID, Full Token ID, Proxmox Host, API Endpoint
#
# Usage in Terraform (bpg provider):
#   api_token = "<login.username>=<login.password>"
# ==============================================================================

- name: Search for existing Bitwarden item by name
  ansible.builtin.command:
    argv:
      - bw
      - list
      - items
      - --search
      - "{{ terraform_user_bitwarden_item_name }}"
      - --session
      - "{{ lookup('env', 'BW_SESSION') }}"
  register: terraform_bw_search_raw
  delegate_to: localhost
  run_once: true
  changed_when: false
  no_log: true

- name: Parse Bitwarden search results
  ansible.builtin.set_fact:
    terraform_bw_existing_items: "{{ terraform_bw_search_raw.stdout | from_json }}"
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Determine existing Bitwarden item ID (if any)
  ansible.builtin.set_fact:
    terraform_bw_existing_item_id: >-
      {{
        (
          terraform_bw_existing_items
          | selectattr('name', 'equalto', terraform_user_bitwarden_item_name)
          | list
          | first
          | default({})
        ).id | default('')
      }}
  delegate_to: localhost
  run_once: true

- name: Look up Bitwarden folder ID
  ansible.builtin.command:
    argv:
      - bw
      - list
      - folders
      - --search
      - "{{ terraform_user_bitwarden_folder_name }}"
      - --session
      - "{{ lookup('env', 'BW_SESSION') }}"
  register: terraform_bw_folders_raw
  delegate_to: localhost
  run_once: true
  changed_when: false
  no_log: true
  when: terraform_user_bitwarden_folder_name | length > 0

- name: Parse Bitwarden folder ID
  ansible.builtin.set_fact:
    terraform_bw_folder_id: >-
      {{
        (
          terraform_bw_folders_raw.stdout | from_json
          | selectattr('name', 'equalto', terraform_user_bitwarden_folder_name)
          | list
          | first
          | default({})
        ).id | default(None)
      }}
  delegate_to: localhost
  run_once: true
  when:
    - terraform_user_bitwarden_folder_name | length > 0
    - terraform_bw_folders_raw.stdout is defined
  no_log: true

# Build the Bitwarden item as an Ansible dict, then convert to JSON.
# Using to_json filter ensures proper escaping without shell quoting issues.
- name: Build Bitwarden item JSON payload
  ansible.builtin.set_fact:
    terraform_bw_item_json: >-
      {{
        {
          "organizationId": None,
          "folderId": terraform_bw_folder_id | default(None),
          "type": 1,
          "name": terraform_user_bitwarden_item_name,
          "notes": "Generated by Ansible role darrickross.proxmox.terraform_user on " + ansible_date_time.iso8601,
          "login": {
            "username": terraform_token_full_id,
            "password": terraform_token_secret,
            "uris": [
              {
                "match": None,
                "uri": "https://" + inventory_hostname + ":8006"
              }
            ]
          },
          "fields": [
            { "name": "PVE User",      "value": terraform_user_pve_userid,    "type": 0 },
            { "name": "Token ID",      "value": terraform_user_pve_token_id,  "type": 0 },
            { "name": "Full Token ID", "value": terraform_token_full_id,      "type": 1 },
            { "name": "Proxmox Host",  "value": inventory_hostname,           "type": 0 },
            { "name": "API Endpoint",  "value": "https://" + inventory_hostname + ":8006", "type": 0 },
            { "name": "Ansible Role",  "value": "darrickross.proxmox.terraform_user", "type": 0 }
          ]
        } | to_json
      }}
  delegate_to: localhost
  run_once: true
  no_log: true

# Create new Bitwarden item (echo + bw encode + bw create pipeline).
# Shell module is used intentionally here for the pipe — consistent with
# system_upgrade role which uses shell when piping is genuinely needed.
- name: Create new Bitwarden item
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf '%s' '{{ terraform_bw_item_json }}' \
        | bw encode \
        | bw create item --session "{{ lookup('env', 'BW_SESSION') }}"
    executable: /bin/bash
  delegate_to: localhost
  run_once: true
  when: terraform_bw_existing_item_id | length == 0
  no_log: true
  register: terraform_bw_create_result

- name: Update existing Bitwarden item
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf '%s' '{{ terraform_bw_item_json }}' \
        | bw encode \
        | bw edit item "{{ terraform_bw_existing_item_id }}" --session "{{ lookup('env', 'BW_SESSION') }}"
    executable: /bin/bash
  delegate_to: localhost
  run_once: true
  when: terraform_bw_existing_item_id | length > 0
  no_log: true
  register: terraform_bw_edit_result

- name: Sync Bitwarden vault to persist changes
  ansible.builtin.command:
    argv:
      - bw
      - sync
      - --session
      - "{{ lookup('env', 'BW_SESSION') }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  no_log: true

- name: Confirm Bitwarden storage completed
  ansible.builtin.debug:
    msg: >-
      Bitwarden item '{{ terraform_user_bitwarden_item_name }}'
      {{ 'created' if terraform_bw_existing_item_id | length == 0 else 'updated' }} successfully.
      Retrieve with: bw get item '{{ terraform_user_bitwarden_item_name }}'
  delegate_to: localhost
  run_once: true
