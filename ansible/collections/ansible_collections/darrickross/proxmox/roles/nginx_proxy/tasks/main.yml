---
# Flush anything the has happened before
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# Any task that might install or upgrade nginx must notify the handler
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  notify: Restart nginx

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

# ================================================================================
# Define Systemd monitors
# Monitors to make sure nginx waits for the cert its using to become available
# ================================================================================

- name: Create systemd override directory for nginx
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Create systemd unit to monitor certificates paths
  ansible.builtin.copy:
    dest: /etc/systemd/system/proxmox-certs.path
    content: |
      [Unit]
      Description=Monitor Proxmox SSL certificates

      [Path]
      PathExists={{ nginx_proxy_ssl_certificate }}
      PathExists={{ nginx_proxy_ssl_certificate_key }}
      Unit=proxmox-certs.service

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Reload systemd

- name: Create systemd target for certificate readiness
  ansible.builtin.copy:
    dest: /etc/systemd/system/proxmox-certs.service
    content: |
      [Unit]
      Description=Proxmox SSL certificates are ready
      Requires=proxmox-certs.path
      After=pveproxy.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/true
    mode: "0644"
  notify: Reload systemd

- name: Configure nginx to depend on certificates
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/wait-for-certs.conf
    content: |
      [Unit]
      After=proxmox-certs.service pveproxy.service
      Wants=proxmox-certs.service

      [Service]
      TimeoutStartSec=30
      ExecStartPre=/bin/bash -c 'while [ ! -f {{ nginx_proxy_ssl_certificate }} ] || [ ! -f {{ nginx_proxy_ssl_certificate_key }} ]; do sleep 1; done'
      ExecStartPre=/bin/bash -c 'openssl x509 -in {{ nginx_proxy_ssl_certificate }} -noout'
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers before enabling systemd units
  ansible.builtin.meta: flush_handlers

- name: Enable proxmox-certs.path
  ansible.builtin.systemd:
    name: proxmox-certs.path
    enabled: true
    state: started

# ================================================================================
# Configure Nginx
# ================================================================================

- name: Safely deploy and activate nginx site
  block:
    - name: Template site config (with backup)
      ansible.builtin.template:
        src: proxmox.conf.j2
        dest: "{{ nginx_proxy_site_available_conf }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: tpl

    - name: Enable site
      ansible.builtin.file:
        src: "{{ nginx_proxy_site_available_conf }}"
        dest: "{{ nginx_proxy_site_enabled_conf }}"
        state: link

    - name: Test nginx config
      ansible.builtin.command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Reload nginx (only if test passed)
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: nginx_test.rc == 0

  rescue:
    - name: Restore previous config if backup exists
      when: tpl is defined and tpl.backup_file is defined
      ansible.builtin.copy:
        src: "{{ tpl.backup_file }}"
        dest: "{{ nginx_proxy_site_available_conf }}"
        owner: root
        group: root
        mode: "0644"
        remote_src: true

    # If this was a first-time deploy and test failed, optionally disable the site:
    - name: Disable site (first-time failure)
      ansible.builtin.file:
        path: "{{ nginx_proxy_site_enabled_conf }}"
        state: absent

    - name: Re-test last known good config
      ansible.builtin.command: nginx -t
      register: nginx_retest
      changed_when: false

    - name: Reload nginx (rollback)
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: nginx_retest.rc == 0

  always:
    - name: Show test output
      ansible.builtin.debug:
        msg: "{{ (nginx_test.stderr | default('no initial test')) }}"

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx
